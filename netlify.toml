# なかむらクリニック — static site config
# pretty_urls is deliberately OFF: every canonical, sitemap entry and internal link uses the
# .html form, and Netlify's pretty-URL rewrite would 301 each of them to an extensionless URL.

[[headers]]
  for = "/*"
  [headers.values]
    # STAGING GUARD - remove this one line on launch day (when nakamura.n-clinics.jp goes live).
    # Until then the netlify.app preview must not be indexed as a duplicate of the future site.
    X-Robots-Tag = "noindex"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/styles.css"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

[[headers]]
  for = "/site.js"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

[[headers]]
  for = "/pages.css"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=1209600"

# The qa/ harness ships in the repo (and therefore in the build) but is not part of the site.
# Answer any request for it with the 404 page instead of serving the scripts.
[[redirects]]
  from = "/qa/*"
  to = "/404.html"
  status = 404
  force = true
