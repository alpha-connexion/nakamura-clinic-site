# なかむらクリニック — static site config
# pretty_urls is deliberately OFF: every canonical, sitemap entry and internal link uses the
# .html form, and Netlify's pretty-URL rewrite would 301 each of them to an extensionless URL.

[[headers]]
  for = "/*"
  [headers.values]
    # LAUNCHED 2026-10-07 on nakamura.n-clinics.jp — the staging noindex guard was removed. The netlify.app
    # address forwards to the primary domain, and every page carries its canonical URL.
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# styles.css / site.js / pages.css deliberately carry NO long Cache-Control (removed 2026-09-25):
# Netlify's default (max-age=0, must-revalidate + ETag) makes every visit revalidate, so a phone
# that opened the site last week never renders new HTML with week-old CSS. Deploys are atomic;
# a 304 costs nothing. Only the favicon keeps a long cache.

[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=1209600"

# Fonts carry ?v=<content hash> in every URL (qa/build_fonts.py stamps styles.css + the preloads; QA rule
# FONT URLS VERSIONED), so a rebuilt subset always gets a new URL and the files can be cached for a year.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Photos: 30 days. When a photo is REPLACED, give the new file a new name (never overwrite in place),
# or returning visitors keep the old image for up to a month.
[[headers]]
  for = "/photos/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# One public address: the netlify.app preview URL forwards permanently to the clinic's domain.
[[redirects]]
  from = "https://nakamura-clinic.netlify.app/*"
  to = "https://nakamura.n-clinics.jp/:splat"
  status = 301
  force = true

# The branch-deploy host serves the same site and is indexable (deploy permalinks get noindex; this one does not).
[[redirects]]
  from = "https://main--nakamura-clinic.netlify.app/*"
  to = "https://nakamura.n-clinics.jp/:splat"
  status = 301
  force = true

# The qa/ harness ships in the repo (and therefore in the build) but is not part of the site.
# Answer any request for it with the 404 page instead of serving the scripts.
[[redirects]]
  from = "/qa/*"
  to = "/404.html"
  status = 404
  force = true
